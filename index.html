<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chai is Love</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: url('https://img.freepik.com/premium-photo/indian-masala-chai-tea-hot-masala-chai-spiced-tea-with-milk-spices-is-poured-into-glass-glass-dark-background-long-banner-format-place-text_114941-4854.jpg?w=900') no-repeat center center/cover;
            background-size: cover;
        }
        .container {
            background-color: rgba(0, 0, 0, 0.6);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            text-align: center;
            width: 500px;
            height: 350px;
            position: relative;
            border: 2px solid white;
            overflow: hidden;
        }
        h1 {
            font-family: 'Great Vibes', cursive;
            color: white;
            font-size: 36px;
            margin-bottom: 20px;
        }
        .buttons {
            position: relative;
            margin-top: 100px;
        }
        .btn {
            background: white;
            color: #520f1a;
            padding: 10px 20px;
            border: 1px solid black;
            font-size: 18px;
            cursor: pointer;
            transition: background 0.3s, transform 0.3s ease-in-out;
            position: absolute;
        }
        .btn:hover {
            background: #ffccd5;
        }
        #yesBtn {
            left: 30%;
            bottom: 20px;
        }
        #noBtn {
            left: 60%;
            bottom: 20px;
            transition: transform 0.4s ease-in-out;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 id="question">Would you like to go on a Chai date with me this Sunday?</h1>
        <p id="extraMessage" class="love-message" style="display: none;">Made with love and chai @itsatulpal80</p>
        <div class="buttons">
            <button class="btn" id="yesBtn">Yes</button>
            <button class="btn" id="noBtn">No</button>
        </div>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const question = document.getElementById('question');

        noBtn.addEventListener('mouseenter', () => {
            let container = document.querySelector('.container');
            let maxX = container.clientWidth - 100;  
            let maxY = container.clientHeight - 100;
            
            let randomX = Math.random() * maxX - maxX / 2;
            let randomY = Math.random() * maxY - maxY / 2;

            noBtn.style.transform = `translate(${randomX}px, ${randomY}px)`;
        });

        yesBtn.addEventListener('click', () => {
            question.textContent = "I Know You Would Say Yes! Can't wait to see you!";
            extraMessage.style.display = "block"; 
         
            yesBtn.remove();
            noBtn.remove();
        });
    </script>
</body>
</html>
